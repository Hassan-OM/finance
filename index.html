<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d6b58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="standalone.js"></script>
<title>Hassan Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a ledger-style money console — left rail navigation, a single
   "left until payday" figure leads, everything else is scannable panels. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#0f1a17; --ink-2:#47574f; --muted:#7c8a84;
  --line:#dbe3df; --accent:#0d6b58; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --good:#0a7d0a; --good-text:#006300; --warn:#c98500; --warn-bg:#fff4d6; --bad:#d03b3b; --bad-bg:#fde8e6; --serious:#ec835a;
  --s1:#2a78d6; --s2:#eb6834; --grid:#e1e6e3; --axis:#c3cbc7;
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(15,26,23,.06),0 4px 16px rgba(15,26,23,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1210; --surface:#141c19; --surface-2:#18221e; --ink:#e8f0ec; --ink-2:#a7b6af; --muted:#76857f;
    --line:#25302c; --accent:#3cbf9c; --accent-ink:#06231b; --accent-soft:#163a31;
    --good:#0ca30c; --good-text:#3fcf6a; --warn:#fab219; --warn-bg:#3a2e10; --bad:#e66767; --bad-bg:#3d1d1c; --serious:#ec835a;
    --s1:#3987e5; --s2:#d95926; --grid:#232d29; --axis:#38433f;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1210; --surface:#141c19; --surface-2:#18221e; --ink:#e8f0ec; --ink-2:#a7b6af; --muted:#76857f;
  --line:#25302c; --accent:#3cbf9c; --accent-ink:#06231b; --accent-soft:#163a31;
  --good:#0ca30c; --good-text:#3fcf6a; --warn:#fab219; --warn-bg:#3a2e10; --bad:#e66767; --bad-bg:#3d1d1c; --serious:#ec835a;
  --s1:#3987e5; --s2:#d95926; --grid:#232d29; --axis:#38433f;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
h1{font-size:24px} h2{font-size:17px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-display);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 16px var(--font-display)}
.brand b{font:600 16px var(--font-display);display:block}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-inline-start:auto;background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--muted);padding:0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{all:unset;cursor:pointer;padding:5px 11px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sync{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1240px;width:100%;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--ink-2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-h .sub{color:var(--muted);font-size:13px}
.span2{grid-column:span 2}

.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.hero-main{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.hero-main .lbl{opacity:.85;font-weight:500}
.hero-main .big{font:600 clamp(34px,5vw,48px)/1.05 var(--font-display);font-variant-numeric:tabular-nums}
.hero-main .big small{font-size:.42em;font-weight:500;opacity:.85;margin-inline-start:6px}
.hero-main .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;opacity:.92}
.hero-main .eq{font-size:13px;opacity:.85}
.hero-main.neg{background:var(--bad)}
.hero-main .cycle-bar{height:6px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:6px}
.hero-main .cycle-bar i{display:block;height:100%;background:currentColor;opacity:.9}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .lbl{color:var(--ink-2);font-size:13px}
.tile .val{font:600 22px var(--font-display);font-variant-numeric:tabular-nums}
.tile .foot{font-size:12px;color:var(--muted)}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.click{cursor:pointer;border-radius:8px}
.row.click:hover{background:var(--surface-2)}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.row .amt{text-align:end}
.in{color:var(--good-text)}
.cat-dot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:600 12px var(--font-display);background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.cat-dot.inc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.day-h{font-size:12px;font-weight:600;color:var(--muted);padding:14px 4px 4px;display:flex;justify-content:space-between}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tile .pill{white-space:normal}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.good{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.ai{background:transparent;color:var(--s1);border-color:var(--s1)}

.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.brow{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.confirm{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500;min-width:0}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%;color:var(--ink);font-size:14px}
textarea.inp{min-height:180px;resize:vertical;line-height:1.6}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.toolbar .inp{width:auto;min-width:140px}

.draft{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:auto repeat(6,minmax(0,1fr));gap:10px;align-items:end;background:var(--surface)}
.draft.off{opacity:.5}
.draft .raw{grid-column:2/-1;font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:3.2em;overflow:hidden}
.draft .flags{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap}

.sub-card{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 4px;border-top:1px solid var(--line)}
.sub-card:first-child{border-top:0}
.sub-card .name{font-weight:600;font-family:var(--font-display)}
.sub-card .meta{font-size:13px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.empty{color:var(--muted);padding:18px 4px;text-align:center;font-size:14px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);margin-bottom:16px;border:1px solid transparent}
.banner.info{background:var(--accent-soft)}
.banner.bad{background:var(--bad-bg)}
.tl{display:flex;flex-direction:column}
.tl-month{font:600 12px var(--font-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px;border-bottom:1px solid var(--line)}
.tl-step{display:grid;grid-template-columns:auto 64px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.tl-step.done{opacity:.55}
.tl-step.done .tl-title{text-decoration:line-through}
.tl-step.next{background:var(--accent-soft);margin:0 -12px;padding:12px;border-radius:10px;border-bottom-color:transparent}
.tl-check{all:unset;cursor:pointer;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--accent-ink);background:var(--surface);margin-top:2px}
.tl-check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.tl-check:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tl-date{display:flex;flex-direction:column;font-size:13px;line-height:1.3}
.tl-date span{color:var(--muted);font-size:12px}
.tl-title{font-weight:600;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tl-detail{font-size:14px;color:var(--ink-2);margin-top:2px;line-height:1.55}
.ptable{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.ptable th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
.ptable td{padding:10px;border-bottom:1px solid var(--line);text-align:start}
.ptable tr.click{cursor:pointer}
.ptable tr.click:hover td,.ptable tr.open td{background:var(--surface-2)}
.ptable tr.det td{background:var(--surface-2);padding:4px 14px 10px}
.alerts{display:grid;gap:8px;margin-bottom:16px}
.alert{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr 120px;gap:12px;align-items:center;padding:11px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);font-size:14px;font-weight:500}
.alert:focus-visible{outline:2px solid var(--accent)}
.alert.over{background:var(--bad-bg)}
.alert.pace{background:var(--surface);border:1px solid var(--line)}
.alert-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--font-display);background:var(--warn);color:#0b0b0b}
.alert.over .alert-ic{background:var(--bad);color:#fff}
.alert.pace .alert-ic{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.alert-bar{height:6px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.alert-bar i{display:block;height:100%;background:var(--warn)}
.alert.over .alert-bar i{background:var(--bad)} .alert.pace .alert-bar i{background:var(--ink-2)}
@media (max-width:600px){.alert{grid-template-columns:auto 1fr}.alert-bar{grid-column:1/-1}}
.review{line-height:1.7;max-width:72ch}
.review h3{margin:14px 0 4px;font-size:15px}
.review ul{margin:4px 0;padding-inline-start:20px}
.review p{margin:6px 0}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--font-body)}
.chart .lbl-strong{fill:var(--ink-2);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:7px;font-size:12px;line-height:1.4;max-width:240px;white-space:pre-line;box-shadow:var(--shadow)}

.modal{position:fixed;inset:0;background:rgba(8,14,12,.45);display:grid;place-items:center;padding:16px;z-index:40}
.modal[hidden]{display:none}
.dialog{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dialog .panel-h{margin-bottom:16px}
.x{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:500;text-align:center;position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .count{position:absolute;top:2px;inset-inline-end:18%;background:var(--warn);color:#0b0b0b;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px}
.more-list{display:flex;flex-direction:column}
.more-list button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--line);font-weight:500;font-size:16px}
.more-list svg{width:20px;height:20px;color:var(--ink-2)}
#gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));overflow:auto}
#gate[hidden]{display:none}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.gate-p{color:var(--ink-2);font-size:14px;margin:0 0 12px}
#toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
[dir="rtl"] #toast{transform:translateX(50%)}
#toast div{background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:9px;font-size:14px;box-shadow:var(--shadow)}

@media (max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}}
@media (max-width:860px){
  input.inp,select.inp,textarea.inp,.toolbar .inp{font-size:16px}
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  .side .nav{display:none}
  .side{padding-top:calc(10px + env(safe-area-inset-top))!important;padding-inline:calc(14px + env(safe-area-inset-left))!important}
  .tabbar{display:grid}
  .head h1{font-size:21px}
  .head .btns .btn{padding:7px 12px}
  .panel{padding:14px}
  .hero-main{padding:18px}
  .modal{align-items:end;padding:0}
  .dialog{width:100%;border-radius:16px 16px 0 0;max-height:88%;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(80px + env(safe-area-inset-bottom))}
  .tl-step{grid-template-columns:auto 52px 1fr;gap:10px}
  .tl-step.next{margin:0 -8px;padding:12px 8px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:8px;border-inline-end:0;border-bottom:1px solid var(--line)}
  .brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;width:100%;order:3;gap:4px;scrollbar-width:none}
  .nav button{padding:7px 10px;white-space:nowrap;font-size:14px}
  .nav svg{display:none}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center;padding:0}
  [dir="rtl"] .side-foot{margin:0 auto 0 0}
  .side-foot .sync span{display:none}
  .g2,.g3{grid-template-columns:1fr}
  .span2{grid-column:auto}
  main{padding:18px 16px 60px}
  .draft{grid-template-columns:auto 1fr 1fr}
  .draft .raw,.draft .flags{grid-column:1/-1}
  .brow{grid-template-columns:1fr auto}
  .brow .bar{grid-column:1/-1;grid-row:2}
}
@media (max-width:480px){.g4,.tiles{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.tile .val{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark" aria-hidden="true">ح</div><div><b id="brandName">Hassan Finance</b><small id="brandSub">Budget &amp; subscriptions</small></div></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <div class="seg" role="group" aria-label="Language"><button id="lang-en" data-lang="en">EN</button><button id="lang-ar" data-lang="ar">ع</button></div>

<script>
/* ===== SMS parser: Saudi bank / wallet transaction messages (AR + EN) ===== */
const SmsParser = (() => {
  const INVISIBLE = /[؜​-‏‪-‮⁦-⁩﻿]/g;
  const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
  const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
  const NUM = '([0-9][0-9,]*(?:\\.[0-9]+)?)';
  const CUR = '(SAR|SR|USD|EUR|GBP|AED|BHD|KWD|QAR|EGP|ر\\.?\\s?س|رس|ريال|\\$)';
  const USD_RATE = 3.75; // SAR is pegged to USD

  function normalize(s) {
    return String(s || '')
      .replace(INVISIBLE, '')
      .replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d))
      .replace(/[۰-۹]/g, d => FA_DIGITS.indexOf(d))
      .replace(/٫/g, '.').replace(/٬/g, ',')
      .replace(/&#\d+;?/g, '')
      .replace(/\r/g, '');
  }

  const DATE_RE = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:\s*[,T]?\s*(\d{1,2}):(\d{2}))?|(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:\s*[,T]?\s*(\d{1,2}):(\d{2}))?/;

  /** Split a pasted blob into individual messages. */
  function split(text) {
    const t = normalize(text).trim();
    if (!t) return [];
    const chunks = t.split(/\n\s*\n+/).map(c => c.trim()).filter(Boolean);
    const out = [];
    for (const c of chunks) {
      const lines = c.split('\n');
      let buf = [];
      lines.forEach((ln, i) => {
        buf.push(ln);
        const isDate = DATE_RE.test(ln) && ln.replace(DATE_RE, '').replace(/[^A-Za-z؀-ۿ]/g, '').length <= 3;
        const next = lines[i + 1];
        // a message usually ends on its date line; split when more text follows
        if (isDate && next && !DATE_RE.test(next) && buf.length >= 2) { out.push(buf.join('\n')); buf = []; }
      });
      if (buf.length) {
        // tiny trailing fragment (e.g. "Balance: ...") belongs to previous message
        if (out.length && buf.length === 1 && buf[0].length < 30 && !DATE_RE.test(buf[0])) out[out.length - 1] += '\n' + buf[0];
        else out.push(buf.join('\n'));
      }
    }
    return out;
  }

  function num(s) { return s == null ? null : parseFloat(String(s).replace(/,/g, '')); }
  function pad(n) { return String(n).padStart(2, '0'); }

  function parseDate(t) {
    const m = t.match(DATE_RE);
    if (!m) return null;
    let y, mo, d, hh, mm;
    if (m[6]) { y = +m[6]; mo = +m[7]; d = +m[8]; hh = m[9]; mm = m[10]; }
    else {
      d = +m[1]; mo = +m[2]; y = +m[3]; hh = m[4]; mm = m[5];
      if (y < 100) y += 2000;
      if (mo > 12 && d <= 12) { const x = d; d = mo; mo = x; }
    }
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return { date: `${y}-${pad(mo)}-${pad(d)}`, time: hh != null ? `${pad(hh)}:${mm}` : '' };
  }

  function curCode(c) {
    if (!c) return 'SAR';
    c = c.toUpperCase().replace(/\s/g, '');
    if (c === '$') return 'USD';
    if (/^(SAR|SR)$/.test(c) || /ر|ريال/.test(c)) return 'SAR';
    return c;
  }

  function findAmount(lines) {
    const kw = /(مبلغ|المبلغ|بمبلغ|Amount|Amt|بـ|ب\s*:|قيمة)/i;
    const bal = /(رصيد|الرصيد|Balance|Bal\b|المتاح|Available|الحد)/i;
    const pats = [
      new RegExp('(?:مبلغ|المبلغ|بمبلغ|Amount|Amt|بـ|قيمة|ب)\\s*:?\\s*' + CUR + '\\s*' + NUM, 'i'),
      new RegExp('(?:مبلغ|المبلغ|بمبلغ|Amount|Amt|بـ|قيمة|ب)\\s*:?\\s*' + NUM + '\\s*' + CUR + '?', 'i'),
    ];
    for (const ln of lines) {
      if (bal.test(ln) || !kw.test(ln)) continue;
      let m = ln.match(pats[0]); if (m) return { amount: num(m[2]), currency: curCode(m[1]) };
      m = ln.match(pats[1]); if (m && !DATE_RE.test(ln)) return { amount: num(m[1]), currency: curCode(m[2]) };
    }
    const loose = [new RegExp(NUM + '\\s*' + CUR, 'i'), new RegExp(CUR + '\\s*' + NUM, 'i')];
    for (const ln of lines) {
      if (bal.test(ln)) continue;
      let m = ln.match(loose[0]); if (m) return { amount: num(m[1]), currency: curCode(m[2]) };
      m = ln.match(loose[1]); if (m) return { amount: num(m[2]), currency: curCode(m[1]) };
    }
    return null;
  }

  function findBalance(t) {
    const m = t.match(new RegExp('(?:رصيد|الرصيد|Balance|Bal|المتاح|Available)[^0-9\\n]{0,20}?' + NUM, 'i'));
    return m ? num(m[1]) : null;
  }

  const KIND_RULES = [
    ['salary', /(راتب|رواتب|Salary|Payroll)/i, 'in'],
    ['refund', /(استرداد|مسترد|إرجاع|ارجاع|Refund|Reversal|عكس)/i, 'in'],
    ['transfer_in', /(واردة|وارد|إيداع|ايداع|Deposit|Credit\s*Transfer|Incoming|Received|استلام|Credited|\bCredit\b(?!\s*Card))/i, 'in'],
    ['bill', /(سداد|فاتورة|SADAD|Bill\s*Pay|Bill\b|مفوتر)/i, 'out'],
    ['atm', /(سحب|صراف|ATM|Withdrawal|Cash)/i, 'out'],
    ['transfer_out', /(صادرة|صادر|تحويل|حوالة|Transfer|Outgoing|Debit\s*Transfer|Sent)/i, 'out'],
    ['online', /(إنترنت|انترنت|Online|E-?Commerce|Internet)/i, 'out'],
    ['purchase', /(شراء|Purchase|POS|نقاط\s*البيع|مدفوعات|Payment|دفع|Spent)/i, 'out'],
  ];

  function findKind(t) {
    for (const [k, re, dir] of KIND_RULES) if (re.test(t)) return { kind: k, dir };
    return { kind: 'unknown', dir: 'out' };
  }

  function cleanName(s) {
    return s.replace(/^[\s:：\-–]+/, '').replace(/[\s*:]+$/, '').replace(/\s{2,}/g, ' ').trim();
  }
  const looksAccount = s => /^[\d*\sxX#-]+$/.test(s) || /^\d{2,}\*/.test(s);

  function findParty(lines, kind) {
    const skip = /(رصيد|Balance|Amount|مبلغ|بـ\s*:?\s*\d|بطاقة|Card|مدى|فيزا|ماستر|Visa|Master|A\/C|حساب|Account|في\s*:?\s*\d|^\d)/i;
    const pats = kind === 'transfer_in' || kind === 'salary' || kind === 'refund'
      ? [/^(?:من|From|المرسل|Sender(?!\s*A\/C)|اسم المرسل)\s*:?\s*(.+)$/i]
      : kind === 'transfer_out'
        ? [/^(?:إلى|الى|لـ|To|المستفيد|Beneficiary|Recipient)\s*:?\s*(.+)$/i]
        : [/^(?:لدى|لـ|عند|At|Merchant|التاجر|المتجر|اسم التاجر)\s*:?\s*(.+)$/i, /^(?:من|From)\s*:?\s*(.+)$/i, /^(?:في)\s*:?\s*(.+)$/i];
    if (kind === 'bill') {
      const b = lines.join('\n').match(/(?:مفوتر|Biller|الجهة)\s*:?\s*([^\n]+)/i);
      if (b) return 'SADAD ' + cleanName(b[1]);
    }
    for (const p of pats) for (const ln of lines) {
      const m = ln.trim().match(p);
      if (m) {
        const v = cleanName(m[1]);
        if (v && !looksAccount(v) && !DATE_RE.test(v) && !/^\d/.test(v) && !(skip.test(v) && v.length < 4)) return v;
      }
    }
    return '';
  }

  function findAccount(t, kind) {
    const lines = t.split('\n').filter(l => !/Sender|المرسل|من\s*:?\s*\d{3}$/i.test(l) || kind === 'transfer_out');
    const s = lines.join('\n');
    let m = s.match(/\*{1,4} ?(\d{3,4})\b/);
    if (m) return m[1];
    m = s.match(/عبر\s*(\d{4})/); if (m) return m[1];
    m = s.match(/(?:بطاقة|Card|حساب|Account|A\/C)[^0-9\n]{0,12}(\d{4})\b/i); if (m) return m[1];
    return '';
  }

  function findMethod(t) {
    if (/ابل|Apple\s*Pay/i.test(t)) return 'Apple Pay';
    if (/مدى|mada/i.test(t)) return 'mada';
    if (/فيزا|Visa/i.test(t)) return 'Visa';
    if (/ماستر|Master/i.test(t)) return 'Mastercard';
    return '';
  }

  function guessSource(t) {
    if (/STC\s*Bank|اس\s*تي\s*سي/i.test(t)) return 'STC Bank';
    if (/barq|برق/i.test(t)) return 'barq';
    if (/Mobily\s*Pay|موبايلي\s*باي/i.test(t)) return 'Mobily Pay';
    if (/D360|دال\s*360/i.test(t)) return 'D360';
    if (/الراجحي|Rajhi/i.test(t)) return 'Al Rajhi';
    if (/الأهلي|الاهلي|SNB|AlAhli/i.test(t)) return 'SNB';
    if (/الرياض|Riyad/i.test(t)) return 'Riyad Bank';
    if (/الإنماء|الانماء|Alinma/i.test(t)) return 'Alinma';
    return '';
  }

  /** Parse one message. Returns a draft transaction plus a confidence 0..1 */
  function parseOne(raw, today) {
    const t = normalize(raw).trim();
    const lines = t.split('\n').map(l => l.trim()).filter(Boolean);
    const { kind, dir } = findKind(t);
    const amt = findAmount(lines);
    const dt = parseDate(t);
    const party = findParty(lines, kind);
    const r = {
      raw: t, kind, dir,
      amount: amt ? amt.amount : null,
      currency: amt ? amt.currency : 'SAR',
      date: dt ? dt.date : today, time: dt ? dt.time : '',
      merchant: party,
      account: findAccount(t, kind),
      method: findMethod(t),
      bank: guessSource(t),
      balance: findBalance(t),
    };
    if (r.amount != null && r.currency !== 'SAR') {
      r.originalAmount = r.amount;
      r.amount = r.currency === 'USD' ? Math.round(r.amount * USD_RATE * 100) / 100 : r.amount;
      r.fxEstimated = r.currency !== 'USD';
    }
    let c = 0;
    if (r.amount != null) c += 0.5;
    if (dt) c += 0.2;
    if (r.merchant) c += 0.2;
    if (kind !== 'unknown') c += 0.1;
    r.confidence = Math.round(c * 100) / 100;
    return r;
  }

  function merchantKey(name) {
    return String(name || '').toUpperCase().replace(/[^A-Z0-9؀-ۿ]/g, '').slice(0, 14);
  }

  return { normalize, split, parseOne, parseDate, merchantKey };
})();
if (typeof module !== 'undefined') module.exports = SmsParser;

</script>

const WALLET_RE = [

  [/STC\s*(PAY|BANK)|STCPAY|اس\s*تي\s*سي\s*(باي|بنك)/i, k => /stc/i.test(k.bank + ' ' + k.name)],
  [/\bBARQ\b|برق/i, k => /barq/i.test(k.bank + ' ' + k.name)],
  [/D\s*360|دال\s*360/i, k => /d360/i.test((k.bank + ' ' + k.name).replace(/\s/g, ''))],
  [/\bNEO\b|نيو/i, k => /neo/i.test(k.bank + ' ' + k.name)],

  // digits of another own card mentioned in the message (e.g. "to card ****1234")
  const nums = [...String(d.raw || '').matchAll(/[*xX•]\s?(\d{3,4})\b/g)].map(m => m[1]);
  for (const k of S.cards) { if (src && k.id === src.id) continue; if ((k.digits || []).some(dg => dg.length >= 4 && nums.includes(dg))) return k; }
  return null;
}

  const own = ownCardTarget(d);
  if (own && d.dir === 'out') return { cat: own.type === 'credit' ? 'cc_payment' : 'internal', how: 'own', to: own.id };
  if (own && d.dir === 'in') return { cat: 'internal', how: 'own' };
  if (/(سداد\s*بطاق|بطاقة\s*ائتمان|Credit\s*Card\s*(Payment|Repayment)|Card\s*Payment)/i.test(d.raw || '')) return { cat: 'cc_payment', how: 'kind' };
  if (KIND_CAT[d.kind] && (d.kind !== 'transfer_out')) return { cat: KIND_CAT[d.kind], how: 'kind' };

  const cats = CATS.map(c => `${c.id}: ${c.en}`).join('; ');
  const lines = need.map((d, i) => `#${i} parsed: merchant="${d.merchant}", kind=${d.kind}, amount=${d.amount}, dir=${d.dir}\nSMS:\n${d.raw}`).join('\n---\n');
  const prompt = `You help a personal budgeting app in Saudi Arabia (currency SAR). For each bank/wallet SMS below, pick the best category id and a clean, human merchant name (keep Arabic names in Arabic, expand obvious truncations like "SEVEN GRA" -> "Seven Grams"). If the amount is missing, extract amount (number, SAR), direction ("out" for money leaving, "in" for money received) and date (YYYY-MM-DD) from the SMS.\nCategories: ${cats}.\nUse "other" when genuinely unknown. Incoming person-to-person transfers are transfer_in.\n\n${lines}\n\nReturn JSON: {"items":[{"i":0,"category":"id","merchant":"name","amount":null,"dir":null,"date":null}]}`;

  + (S.cards.length ? `<optgroup label="${esc(t('move_to'))}">` + S.cards.map(k => `<option value="to:${esc(k.id)}" ${isMove(cat) && to === k.id ? 'selected' : ''}>→ ${esc(k.type === 'credit' ? t('pay_card', { c: cardLabel(k) }) : cardLabel(k))}</option>`).join('') + '</optgroup>' : '');
function parseCat(v) { v = String(v || ''); if (v.startsWith('to:')) { const id = v.slice(3); const k = S.cards.find(c => c.id === id); return { category: k && k.type === 'credit' ? 'cc_payment' : 'internal', toCardId: id }; } return { category: v, toCardId: '' }; }
const catOptions = (sel, dir) => CATS.filter(c => !dir || c.t === dir || c.t === 'both').map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c[S.lang])}</option>`).join('');
const initials = id => { const n = catName(id); return esc(n.replace(/[^\p{L}]/gu, '').slice(0, S.lang === 'ar' ? 1 : 2)); };
const accName = a => { if (!a) return ''; const c = cardForAccount(a); return c ? cardLabel(c) : '•' + normDigits(a); };
const txCardName = x => { const c = cardOf(x); return c ? cardLabel(c) : (x.account ? '•' + normDigits(x.account) : ''); };
const cardOptions = (sel) => `<option value="">${esc(t('no_card'))}</option>` + S.cards.map(c => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(cardLabel(c))}</option>`).join('');
function txRow(x) {
  const inc = x.dir === 'in';
  return `<div class="row click" data-edit-tx="${esc(x.id)}" role="button" tabindex="0">
    <div class="cat-dot ${inc ? 'inc' : ''}" aria-hidden="true">${initials(x.category)}</div>
    <div style="min-width:0"><div class="t">${esc(x.merchant || catName(x.category))}</div>
      <div class="s"><span>${esc(catName(x.category))}</span>${txCardName(x) ? `<span>${esc(txCardName(x))}</span>` : ''}<span>${esc(fmtShort(x.date))}${x.time ? ' ' + esc(x.time) : ''}</span>${x.review ? `<span class="pill warn">${esc(t('review_only'))}</span>` : ''}</div></div>
    <div class="amt ${inc ? 'in' : ''}">${money(inc ? x.amount : -x.amount, { sign: true })}</div></div>`;
}
const head = (title, sub, actions) => `<div class="head"><div><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${actions ? `<div class="btns">${actions}</div>` : ''}</div>`;
const pillDays = d => { const n = diffDays(todayStr(), d); const cls = n < 0 ? 'bad' : n <= 3 ? 'warn' : ''; return `<span class="pill ${cls}">${esc(n < 0 ? t('overdue') : relDay(d))}</span>`; };
function budgetState(spent, limit) { if (!limit) return ''; const p = spent / limit; return p > 1 ? 'bad' : p * 100 >= (+S.settings.warnAt || 80) ? 'warn' : ''; }

/* ================= views ================= */
function vHome() {
  const c = curCycle(), td = todayStr();
  const T = cycleTotals(c);
  const daysLeft = Math.max(1, diffDays(td, c.next));
  const due = upcoming(td, c.end); const dueTot = due.reduce((s, x) => s + x.amount, 0);
  const sal = +S.settings.expectedSalary || 0;
  const incomeBasis = T.sal > 0 ? T.inc : (sal ? sal + T.inc : 0);
  let left = incomeBasis - T.out - dueTot;
  const mLim = +S.settings.monthlyLimit || 0;
  const hasCash = S.cards.some(k => k.type !== 'credit' && cardBalance(k).v != null);
  let cashLine = '';
  if (hasCash) { const f0 = forecast(1)[0]; const cn = cashNow(); left = f0.closing; cashLine = t('cash_eq', { c: moneyTxt(Math.round(cn)), u: moneyTxt(Math.round(cn - f0.closing)) }); }
  const cycleLen = diffDays(c.start, c.next), elapsed = diffDays(c.start, td) + 1;
  // pace vs last cycle at same day
  const p = shiftCycle(c, -1); const pEnd = addDays(p.start, elapsed - 1);
  const pOut = S.tx.filter(x => x.dir === 'out' && counts(x) && x.date >= p.start && x.date <= pEnd).reduce((s, x) => s + x.amount, 0);
  const pace = pOut > 0 ? Math.round((T.out / pOut - 1) * 100) : null;
  const subsMonth = S.subs.filter(s => s.active !== false).reduce((s, x) => s + subMonthly(x), 0);
  const rv = S.tx.filter(x => x.review).length;

  const hero = (incomeBasis || hasCash)
    ? `<div class="hero-main ${left < 0 ? 'neg' : ''}"><div class="lbl">${esc(t('left_to_spend'))}</div>
        <div class="big"><span class="num">${nf0.format(left)}</span><small>${t('sar')}</small></div>
        <div class="eq">${esc(hasCash ? cashLine : t('left_eq', { i: moneyTxt(incomeBasis), s: moneyTxt(T.out), u: moneyTxt(dueTot) }))}</div>
        <div class="meta"><span>${esc(t('payday'))}: ${esc(fmtDate(c.next))} · <span class="num">${daysLeft}</span> ${esc(t(daysLeft === 1 ? 'day_left' : 'days_left'))}</span><span>${esc(t('per_day', { v: moneyTxt(Math.round(left / daysLeft)) }))}</span></div>
        <div class="cycle-bar" aria-hidden="true"><i style="width:${Math.min(100, elapsed / cycleLen * 100)}%"></i></div></div>`
    : mLim ? `<div class="hero-main ${T.out > mLim ? 'neg' : ''}"><div class="lbl">${esc(t('left_limit'))}</div>
        <div class="big"><span class="num">${nf0.format(mLim - T.out)}</span><small>${t('sar')}</small></div>
        <div class="eq">${esc(t('spent_cycle'))} ${esc(moneyTxt(Math.round(T.out)))} / ${esc(moneyTxt(mLim))} · ${Math.round(T.out / mLim * 100)}%</div>
        <div class="meta"><span>${esc(t('payday'))}: ${esc(fmtDate(c.next))} · <span class="num">${daysLeft}</span> ${esc(t(daysLeft === 1 ? 'day_left' : 'days_left'))}</span><span>${esc(t('per_day', { v: moneyTxt(Math.max(0, Math.round((mLim - T.out) / daysLeft))) }))}</span></div>
        <div class="cycle-bar" aria-hidden="true"><i style="width:${Math.min(100, T.out / mLim * 100)}%"></i></div></div>`
    : `<div class="hero-main"><div class="lbl">${esc(t('spent_cycle'))}</div>
        <div class="big"><span class="num">${nf0.format(T.out)}</span><small>${t('sar')}</small></div>
        <div class="meta"><span>${esc(t('payday'))}: ${esc(fmtDate(c.next))} · <span class="num">${daysLeft}</span> ${esc(t(daysLeft === 1 ? 'day_left' : 'days_left'))}</span></div>
        <div class="eq">${esc(t('set_salary_hint'))} <button class="btn sm" data-nav="settings" style="margin-inline-start:6px">${esc(t('go_settings'))}</button></div>
        <div class="cycle-bar" aria-hidden="true"><i style="width:${Math.min(100, elapsed / cycleLen * 100)}%"></i></div></div>`;

  const tiles = `<div class="tiles">
    ${incomeBasis ? '' : `<div class="tile"><span class="lbl">${esc(t('last_spent'))}</span><span class="val">${money(cycleTotals(p).out, { round: true })}</span><span class="foot">${esc(t('cycle_of', { a: fmtShort(p.start), b: fmtShort(p.end) }))}</span></div>`}
    <div class="tile" ${incomeBasis ? '' : 'hidden'}><span class="lbl">${esc(t('spent_cycle'))}</span><span class="val">${money(T.out, { round: true })}</span><span class="foot">${pace == null ? esc(t('no_last')) : esc(t('vs_last', { p: (pace > 0 ? '+' : '') + pace + '%' }))}</span></div>
    <div class="tile"><span class="lbl">${esc(t('income_cycle'))}</span><span class="val">${money(T.inc, { round: true })}</span><span class="foot">${esc(t('cycle_of', { a: fmtShort(c.start), b: fmtShort(c.end) }))}</span></div>
    <div class="tile"><span class="lbl">${esc(t('upcoming_payday'))}</span><span class="val">${money(dueTot, { round: true })}</span><span class="foot">${esc(t('due_by', { n: due.length, d: fmtShort(c.end) }))}</span></div>
    <div class="tile"><span class="lbl">${esc(t('subs_month'))}</span><span class="val">${money(subsMonth, { round: true })}</span><span class="foot">${S.subs.filter(s => s.active !== false).length} ${esc(t('active'))}</span></div></div>`;

  const up = upcoming(td, addDays(td, 30));
  const dueNow = dueItems(c.end);
  const upLater = up.filter(u => u.date > c.end);
  const upHtml = (dueNow.length || upLater.length) ? dueNow.map(x => dueRow(x, true)).join('') + upLater.map(u => `<div class="row"><div class="cat-dot" aria-hidden="true">${u.type === 'sub' ? '↻' : '٪'}</div>
      <div style="min-width:0"><div class="t">${esc(u.name)}</div><div class="s"><span>${esc(fmtDate(u.date))}</span>${u.est ? `<span class="pill">${esc(t('estimate'))}</span>` : ''}${u.ends ? `<span class="pill bad">${esc(t('ends', { d: '' }))}</span>` : ''}</div></div>
      <div class="amt">${u.amountMin ? `<span class="num" style="color:var(--muted);font-size:12px">${nf0.format(u.amountMin)} – </span>` : ''}${money(u.amount, { round: false })}<div>${pillDays(u.date)}</div></div></div>`).join('') : `<div class="empty">${esc(t('nothing_due'))}</div>`;

  const lim = OUT_CATS.filter(k => S.budgets[k.id] && S.budgets[k.id].limit > 0 && !budgetHost(k.id));
  const budHtml = lim.length ? lim.map(k => { const sp = budgetSpentOf(k.id, T.byCat), l = S.budgets[k.id].limit, st = budgetState(sp, l);
    return `<div class="brow"><span>${esc(budgetLabel(k.id))}</span><div class="bar ${st}"><i style="width:${Math.min(100, sp / l * 100)}%"></i></div><span class="num" style="font-size:13px">${nf0.format(sp)} / ${nf0.format(l)}</span></div>`; }).join('')
    : `<div class="empty">${esc(t('no_budgets'))}<div style="margin-top:8px"><button class="btn sm" data-nav="budgets">${esc(t('set_budgets'))}</button></div></div>`;

  const recent = S.tx.slice(0, 8);
  const recHtml = recent.length ? recent.map(txRow).join('') : `<div class="empty">${esc(t('no_tx'))}<div style="margin-top:8px"><button class="btn primary sm" data-nav="add">${esc(t('paste_sms'))}</button></div></div>`;

  const unk = unknownDigits();
  const balHtml = (S.cards.length ? S.cards.map(cardRow).join('') : `<div class="empty">${esc(t('no_cards'))}<div style="margin-top:8px"><button class="btn primary sm" data-edit-card="">${esc(t('add_card'))}</button></div></div>`)
    + unk.map(u => `<div class="row"><div class="cat-dot" aria-hidden="true">?</div><div><div class="t">${esc(t('new_card', { d: u.d }))}</div><div class="s">${esc(t('unknown_hint'))}</div></div><div class="btns"><button class="btn sm ghost" data-ignore-digits="${esc(u.d)}">${esc(t('ignore'))}</button><button class="btn sm" data-new-card="${esc(u.d)}">${esc(t('add_this_card'))}</button></div></div>`).join('');

  return `${head(t('nav_home'), t('cycle') + ': ' + t('cycle_of', { a: fmtLong(c.start), b: fmtLong(c.end) }), `<button class="btn primary" data-nav="add">${esc(t('paste_sms'))}</button>`)}
    ${rv ? `<div class="banner"><span>${esc(t('needs_review', { n: rv }))}</span><button class="btn sm" data-review>${esc(t('review_now'))}</button></div>` : ''}
    ${alertsHtml()}
    <div class="hero">${hero}${tiles}</div>
    <div class="grid g2">
      <section class="panel"><div class="panel-h"><h2>${esc(t('coming_up'))}</h2><span class="sub">${esc(t('next_30'))}</span></div><div class="list">${upHtml}</div></section>
      <section class="panel"><div class="panel-h"><h2>${esc(t('recent'))}</h2><button class="btn ghost sm" data-nav="tx">${esc(t('see_all'))}</button></div><div class="list">${recHtml}</div></section>
      <section class="panel"><div class="panel-h"><h2>${esc(t('budgets_cycle'))}</h2><button class="btn ghost sm" data-nav="budgets">${esc(t('nav_budgets'))}</button></div>${budHtml}</section>
      <section class="panel"><div class="panel-h"><h2>${esc(t('nav_cards'))}</h2><button class="btn ghost sm" data-nav="cards">${esc(t('see_all'))}</button></div><div class="list">${balHtml}</div></section>
    </div>`;
}

function vAdd() {
  const td = todayStr();
  const drafts = S.drafts;
  const cross = drafts.length ? crossedBy(drafts.filter(d => d.on && d.amount != null).map(d => ({ category: d.category, amount: +d.amount, date: d.date, dir: d.dir }))) : [];
  const dHtml = drafts.length ? `<section class="panel" style="margin-top:16px">${cross.length ? `<div class="banner ${cross.some(i => i.state === 'over') ? 'bad' : ''}" style="flex-direction:column;align-items:flex-start;gap:4px"><b>${esc(t('will_cross'))}</b>${cross.map(i => `<span>${esc(limitText(i))}</span>`).join('')}</div>` : ''}<div class="panel-h"><h2>${esc(t('review_title'))}</h2>
      <button class="btn primary" data-save-drafts ${drafts.some(d => d.on && d.amount != null) ? '' : 'disabled'}>${esc(t('save_sel', { n: drafts.filter(d => d.on && d.amount != null).length }))}</button></div>
      <div class="grid" style="gap:10px">${drafts.map((d, i) => `<div class="draft ${d.on ? '' : 'off'}">
        <input type="checkbox" id="d-on-${i}" data-d="${i}" data-k="on" ${d.on ? 'checked' : ''} aria-label="Include" style="width:18px;height:18px;align-self:center">
        <label class="f">${esc(t('kind'))}<select class="inp" id="d-dir-${i}" data-d="${i}" data-k="dir"><option value="out" ${d.dir === 'out' ? 'selected' : ''}>${esc(t('expense'))}</option><option value="in" ${d.dir === 'in' ? 'selected' : ''}>${esc(t('income'))}</option></select></label>
        <label class="f">${esc(t('amount'))}<input class="inp num" type="number" step="0.01" id="d-amt-${i}" data-d="${i}" data-k="amount" value="${d.amount ?? ''}"></label>
        <label class="f">${esc(t('merchant'))}<input class="inp" id="d-m-${i}" data-d="${i}" data-k="merchant" value="${esc(d.merchant)}"></label>
        <label class="f">${esc(t('category'))}<select class="inp" id="d-c-${i}" data-d="${i}" data-k="category">${catMoveOptions(d.category, d.toCardId)}</select></label>
        <label class="f">${esc(t('date'))}<input class="inp" type="date" id="d-dt-${i}" data-d="${i}" data-k="date" value="${esc(d.date)}"></label>
        <label class="f">${esc(t('card'))}<select class="inp" id="d-card-${i}" data-d="${i}" data-k="cardId">${cardOptions(d.cardId)}</select></label>
        <div class="flags">${d.dup ? `<span class="pill bad">${esc(t('dup'))}</span>` : ''}${d.mergeInto ? `<span class="pill good">${esc(t('merged'))}</span>` : ''}${d.amount == null ? `<span class="pill bad">${esc(t('no_amount'))}</span>` : ''}${d.how === 'ai' ? `<span class="pill ai">${esc(t('ai'))}</span>` : ''}${d.currency && d.currency !== 'SAR' ? `<span class="pill warn">${esc(t('fx', { c: d.currency + ' ' + d.originalAmount }))}</span>` : ''}${d.account && !cardForAccount(d.account) && !d.cardSet ? `<button class="pill warn" data-new-card="${esc(normDigits(d.account))}" style="cursor:pointer">${esc(t('new_card', { d: normDigits(d.account) }))} · ${esc(t('add_this_card'))}</button>` : ''}${d.method ? `<span class="pill">${esc(d.method)}</span>` : ''}${d.balance != null ? `<span class="pill">${esc(t('balances'))}: ${nf.format(d.balance)}</span>` : ''}${d.time ? `<span class="pill">${esc(d.time)}</span>` : ''}</div>
        <div class="raw">${esc(d.raw)}</div></div>`).join('')}</div></section>` : '';
  return `${head(t('add_title'), t('add_desc'))}
    <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start" id="addGrid">
      <section class="panel"><label class="f" for="smsIn">${esc(t('paste_here'))}</label>
        <textarea class="inp" id="smsIn" dir="auto" placeholder="شراء-POS&#10;بـ25 SAR&#10;منCOFFEE SHOP&#10;مدى-ابل*1234&#10;01/01/27 09:30" style="margin-top:6px">${esc(S.smsText || '')}</textarea>
        <div class="btns" style="margin-top:10px"><button class="btn primary" data-read ${S.reading ? 'disabled' : ''}>${esc(S.reading ? t('reading') : t('read_msgs'))}</button><button class="btn" data-clear>${esc(t('clear'))}</button></div></section>
      <section class="panel"><h2 style="margin-bottom:12px">${esc(t('manual'))}</h2>
        <form class="form" id="manualForm">
          <label class="f">${esc(t('kind'))}<select class="inp" id="m-dir" name="dir"><option value="out">${esc(t('expense'))}</option><option value="in">${esc(t('income'))}</option></select></label>
          <label class="f">${esc(t('amount'))}<input class="inp num" id="m-amt" name="amount" type="number" step="0.01" min="0" required></label>

          <label class="f">${esc(t('category'))}<select class="inp" id="m-cat" name="category">${catMoveOptions('other', '')}</select></label>
          <label class="f">${esc(t('date'))}<input class="inp" id="m-date" name="date" type="date" value="${td}" required></label>
          <label class="f full">${esc(t('card'))}<select class="inp" id="m-card" name="cardId">${cardOptions((S.cards.find(c => c.main) || {}).id)}</select></label>
          <label class="f full">${esc(t('note'))}<input class="inp" id="m-note" name="note"></label>
          <div class="full"><button class="btn primary" type="submit">${esc(t('save'))}</button></div>
        </form></section>
    </div>${dHtml}
    <style>@media (max-width:860px){#addGrid{grid-template-columns:1fr!important}}</style>`;
}

function cardRow(c) {
  const b = cardBalance(c); const typeName = t('t_' + (c.type || 'debit'));
  return `<div class="row click" data-edit-card="${esc(c.id)}" role="button" tabindex="0"><div class="cat-dot ${c.main ? 'inc' : ''}" aria-hidden="true">${esc((c.bank || c.name || '?').replace(/[^\p{L}\d]/gu, '').slice(0, 2))}</div>
    <div style="min-width:0"><div class="t">${esc(cardLabel(c))}${c.main ? ` <span class="pill good">${esc(t('main_card'))}</span>` : ''}</div><div class="s"><span>${esc(c.bank || typeName)}</span><span>${(c.digits || []).map(d => '•' + esc(d)).join(' ')}</span>${b.src !== 'none' ? `<span>${esc(t(b.src === 'sms' ? 'from_sms' : 'manual_bal'))} · ${esc(fmtShort(b.at.slice(0, 10)))}</span>` : ''}</div></div>
    <div class="amt">${b.v == null ? `<span class="pill warn">${esc(t('no_base'))}</span>` : money(b.v)}${c.type === 'credit' && b.v != null ? `<div class="s" style="font-size:12px;color:var(--muted)">${esc(c.creditLimit ? t('owed', { v: moneyTxt(Math.max(0, Math.round((c.creditLimit - b.v) * 100) / 100)) }) : t('avail'))}</div>` : ''}</div></div>`;
}
function vCards() {
  const c = curCycle(); const unk = unknownDigits();
  const bals = S.cards.map(k => ({ k, b: cardBalance(k) }));
  const total = bals.filter(x => x.b.v != null && (x.k.type || 'debit') !== 'credit').reduce((s, x) => s + x.b.v, 0);
  const list = bals.map(({ k, b }) => { const spent = S.tx.filter(x => { const kk = cardOf(x); return kk && kk.id === k.id && x.dir === 'out' && counts(x) && inCycle(x, c); }).reduce((s, x) => s + x.amount, 0);
    return `<div class="sub-card"><div style="min-width:0"><div class="name">${esc(cardLabel(k))} ${k.main ? `<span class="pill good">${esc(t('main_card'))}</span>` : ''}</div>
      <div class="meta">${k.bank ? `<span>${esc(k.bank)}</span>` : ''}<span>${esc(t('t_' + (k.type || 'debit')))}</span>${(k.digits || []).map(d => `<span class="pill">•${esc(d)}</span>`).join('')}</div>
      <div class="meta" style="color:var(--muted)">${b.src !== 'none' ? `${esc(t(b.src === 'sms' ? 'from_sms' : 'manual_bal'))} · ${esc(fmtLong(b.at.slice(0, 10)))} ${esc(b.at.slice(11))}` : esc(t('no_base'))} · ${esc(t('spent_card'))}: ${money(spent, { round: true })}</div></div>
      <div style="text-align:end"><div style="font:600 20px var(--font-display)">${b.v == null ? '—' : money(b.v)}</div>${(k.type === 'credit') ? `<div style="font-size:12px;color:var(--muted)">${esc(t('avail'))}${k.creditLimit && b.v != null ? ' · ' + esc(t('owed', { v: moneyTxt(Math.max(0, Math.round((k.creditLimit - b.v) * 100) / 100)) })) : ''}</div>` : ''}
      <div class="btns" style="justify-content:flex-end;margin-top:6px"><button class="btn sm" data-card-bal="${esc(k.id)}">${esc(t('update_balance'))}</button><button class="btn sm" data-edit-card="${esc(k.id)}">${esc(t('edit'))}</button></div></div></div>`; }).join('');
  return `${head(t('cards_title'), t('cards_sub'), `<button class="btn primary" data-edit-card="">${esc(t('add_card'))}</button>`)}
    <div class="grid g3" style="margin-bottom:16px">
      <div class="tile"><span class="lbl">${esc(t('total_balance'))}</span><span class="val">${money(total)}</span><span class="foot">${esc(t('t_debit'))} + ${esc(t('t_wallet'))} + ${esc(t('t_account'))}</span></div>
      <div class="tile"><span class="lbl">${esc(t('nav_cards'))}</span><span class="val num">${S.cards.length}</span></div>
      <div class="tile"><span class="lbl">${esc(t('unknown_cards'))}</span><span class="val num">${unk.length}</span></div></div>
    <section class="panel">${list || `<div class="empty">${esc(t('no_cards'))}</div>`}</section>
    ${unk.length ? `<section class="panel" style="margin-top:16px"><div class="panel-h"><h2>${esc(t('unknown_cards'))}</h2></div>${unk.map(u => `<div class="row"><div class="cat-dot">?</div><div><div class="t">•${esc(u.d)}</div><div class="s">${esc(u.last.merchant || '')} · ${esc(fmtShort(u.last.date))} · ${u.n}×</div></div><div class="btns"><button class="btn sm ghost" data-ignore-digits="${esc(u.d)}">${esc(t('ignore'))}</button><button class="btn sm primary" data-new-card="${esc(u.d)}">${esc(t('add_this_card'))}</button></div></div>`).join('')}</section>` : ''}`;

function fcChart(fc) {

  s += `<line x1="${l}" x2="${W - r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  fc.forEach((f, i) => { const cx = l + gw * i + gw / 2, v = f.closing, y0 = y(0), yv = y(v); const col = v < 0 ? 'var(--bad)' : v < 300 ? 'var(--warn)' : 'var(--s1)';

}

/* ---------- charts ---------- */
function chartCats(c) {
  const T = cycleTotals(c);
  const rows = OUT_CATS.map(k => ({ id: k.id, name: k[S.lang], v: T.byCat[k.id] || 0, l: (S.budgets[k.id] && S.budgets[k.id].limit) || 0 })).filter(r => r.v > 0 || r.l > 0).sort((a, b) => b.v - a.v);
  if (!rows.length) return `<div class="empty">—</div>`;
  const W = 560, lw = 150, rh = 30, H = rows.length * rh + 24, max = Math.max(...rows.map(r => Math.max(r.v, r.l))) * 1.12 || 1, x = v => lw + (W - lw - 70) * v / max;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" dir="ltr" role="img" aria-label="${esc(t('ch_cat'))}">`;
  const ticks = niceTicks(max, 4);
  for (const tk of ticks) s += `<line x1="${x(tk)}" x2="${x(tk)}" y1="0" y2="${H - 20}" stroke="var(--grid)"/><text x="${x(tk)}" y="${H - 6}" text-anchor="middle">${nf0.format(tk)}</text>`;
  rows.forEach((r, i) => { const y = i * rh + 6, w = Math.max(2, x(r.v) - lw), over = r.l && r.v > r.l;
    s += `<text x="${lw - 10}" y="${y + 13}" text-anchor="end" class="lbl-strong" style="direction:${S.lang === 'ar' ? 'rtl' : 'ltr'}">${esc(r.name)}</text>`;
    s += `<rect x="${lw}" y="${y + 2}" width="${w}" height="16" rx="4" fill="${over ? 'var(--bad)' : 'var(--s1)'}" data-tip="${esc(r.name)}\n${esc(moneyTxt(r.v))}${r.l ? '\n' + esc(t('limit')) + ': ' + esc(moneyTxt(r.l)) : ''}"/>`;
    if (r.l) s += `<line x1="${x(r.l)}" x2="${x(r.l)}" y1="${y - 1}" y2="${y + 21}" stroke="var(--ink)" stroke-width="2"/>`;
    s += `<text x="${x(r.v) + 6}" y="${y + 14}" class="lbl-strong">${nf0.format(r.v)}</text>`; });
  return s + '</svg>';
}
function niceTicks(max, n) { const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw; const out = []; for (let v = 0; v <= max + 1e-9; v += step) out.push(Math.round(v)); return out; }
function chartFlow(c) {
  const cs = []; let x = c; for (let i = 0; i < 6; i++) { cs.unshift(x); x = shiftCycle(x, -1); }
  const data = cs.map(cc => { const T = cycleTotals(cc); return { c: cc, inc: T.inc, out: T.out }; });
  const W = 560, H = 230, l = 44, b = 26, top = 10, max = Math.max(1, ...data.map(d => Math.max(d.inc, d.out))) * 1.1;
  const y = v => H - b - (H - b - top) * v / max, gw = (W - l - 10) / data.length, bw = Math.min(22, gw / 3);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" dir="ltr" role="img" aria-label="${esc(t('ch_flow'))}">`;
  for (const tk of niceTicks(max, 4)) s += `<line x1="${l}" x2="${W - 10}" y1="${y(tk)}" y2="${y(tk)}" stroke="var(--grid)"/><text x="${l - 6}" y="${y(tk) + 4}" text-anchor="end">${tk >= 1000 ? nf.format(tk / 1000) + 'k' : tk}</text>`;
  s += `<line x1="${l}" x2="${W - 10}" y1="${H - b}" y2="${H - b}" stroke="var(--axis)"/>`;
  data.forEach((d, i) => { const cx = l + gw * i + gw / 2; const tip = `${t('cycle_of', { a: fmtShort(d.c.start), b: fmtShort(d.c.end) })}\n${t('income')}: ${moneyTxt(d.inc)}\n${t('expense')}: ${moneyTxt(d.out)}`;
    s += `<rect x="${cx - bw - 1}" y="${y(d.inc)}" width="${bw}" height="${Math.max(0, H - b - y(d.inc))}" rx="3" fill="var(--s1)"/>`;
    s += `<rect x="${cx + 1}" y="${y(d.out)}" width="${bw}" height="${Math.max(0, H - b - y(d.out))}" rx="3" fill="var(--s2)"/>`;
    s += `<rect x="${cx - gw / 2}" y="${top}" width="${gw}" height="${H - b - top}" fill="transparent" data-tip="${esc(tip)}"/>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(fmtShort(d.c.start))}</text>`; });
  return s + `</svg><div class="legend"><span><i style="background:var(--s1)"></i>${esc(t('income'))}</span><span><i style="background:var(--s2)"></i>${esc(t('expense'))}</span></div>`;
}
function chartPace(c) {
  const p = shiftCycle(c, -1); const len = Math.max(diffDays(c.start, c.next), diffDays(p.start, p.next));
  const cum = (cc, upto) => { const arr = []; let run = 0; for (let i = 0; i < upto; i++) { const d = addDays(cc.start, i); run += S.tx.filter(x => x.date === d && x.dir === 'out' && counts(x)).reduce((s, x) => s + x.amount, 0); arr.push(run); } return arr; };
  const td = todayStr(); const curLen = Math.min(diffDays(c.start, c.next), Math.max(0, diffDays(c.start, td) + 1));
  const A = cum(c, curLen), B = cum(p, diffDays(p.start, p.next));
  const W = 560, H = 230, l = 44, b = 26, top = 12, r = 70, max = Math.max(1, ...A, ...B) * 1.1;
  const X = i => l + (W - l - r) * i / Math.max(1, len - 1), Y = v => H - b - (H - b - top) * v / max;
  const path = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" dir="ltr" role="img" aria-label="${esc(t('ch_cum'))}">`;
  for (const tk of niceTicks(max, 4)) s += `<line x1="${l}" x2="${W - r}" y1="${Y(tk)}" y2="${Y(tk)}" stroke="var(--grid)"/><text x="${l - 6}" y="${Y(tk) + 4}" text-anchor="end">${tk >= 1000 ? nf.format(tk / 1000) + 'k' : tk}</text>`;
  s += `<line x1="${l}" x2="${W - r}" y1="${H - b}" y2="${H - b}" stroke="var(--axis)"/>`;
  [1, 8, 15, 22, len].filter((v, i, a) => v <= len && a.indexOf(v) === i).forEach(dn => s += `<text x="${X(dn - 1)}" y="${H - 8}" text-anchor="middle">${dn}</text>`);
  if (B.length) { s += `<path d="${path(B)}" fill="none" stroke="var(--s2)" stroke-width="2"/>`; const e = B.length - 1; s += `<circle cx="${X(e)}" cy="${Y(B[e])}" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><text x="${X(e) + 8}" y="${Y(B[e]) + 4}" class="lbl-strong">${esc(t('prev_cycle'))}</text>`; }
  if (A.length) { s += `<path d="${path(A)}" fill="none" stroke="var(--s1)" stroke-width="2"/>`; const e = A.length - 1; s += `<circle cx="${X(e)}" cy="${Y(A[e])}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text x="${X(e) + 8}" y="${Y(A[e]) + 4}" class="lbl-strong">${nf0.format(A[e])}</text>`; }
  const cw = (W - l - r) / Math.max(1, len - 1);
  for (let i = 0; i < len; i++) s += `<rect x="${X(i) - cw / 2}" y="${top}" width="${cw}" height="${H - b - top}" fill="transparent" data-tip="${esc((S.lang === 'ar' ? 'اليوم ' : 'Day ') + (i + 1))}${A[i] != null ? '\n' + esc(t('this_cycle')) + ': ' + esc(moneyTxt(A[i])) : ''}${B[i] != null ? '\n' + esc(t('prev_cycle')) + ': ' + esc(moneyTxt(B[i])) : ''}"/>`;
  return s + `</svg><div class="legend"><span><i style="background:var(--s1)"></i>${esc(t('this_cycle'))}</span><span><i style="background:var(--s2)"></i>${esc(t('prev_cycle'))}</span></div>`;
}
function mdLite(s) {
  const lines = esc(s).split('\n'); let h = '', inList = false;
  for (let ln of lines) { ln = ln.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^\s*[-*•]\s+/.test(ln)) { if (!inList) { h += '<ul>'; inList = true; } h += '<li>' + ln.replace(/^\s*[-*•]\s+/, '') + '</li>'; continue; }
    if (inList) { h += '</ul>'; inList = false; }
    if (/^#{1,4}\s/.test(ln)) h += '<h3>' + ln.replace(/^#+\s/, '') + '</h3>'; else if (ln.trim()) h += '<p>' + ln + '</p>'; }
  return h + (inList ? '</ul>' : '');
}

async function readSms() {
  const txt = $('#smsIn').value; S.smsText = txt;
  const msgs = SmsParser.split(txt); if (!msgs.length) return;
  S.reading = true; render();
  const td = todayStr(); const ids = new Set(S.tx.map(x => x.id));
  S.drafts = msgs.map(m => { const d = SmsParser.parseOne(m, td); d.dateGuessed = !SmsParser.parseDate(d.raw); d.id = 'sms-' + hash(d.raw.replace(/\s+/g, ' ')); d.dup = ids.has(d.id);
    const a = autoCategory(d); d.category = a.cat; d.how = a.how; d.toCardId = a.to || ''; if (d.dir === 'in' && findOutgoingPair({ ...d, cardId: '' })) { d.category = 'internal'; d.how = 'kind'; } if (d.kind === 'salary' && !d.merchant) d.merchant = S.lang === 'ar' ? 'الراتب' : 'Salary'; d.on = !d.dup; const kc = cardForAccount(d.account); d.cardId = kc ? kc.id : ''; if (d.dir === 'in' && !isMove(d.category) && findOutgoingPair(d)) d.category = 'internal'; const mm = d.amount != null ? findMarked(d) : null; d.mergeInto = mm ? mm.id : ''; return d; });
  await aiAssist(S.drafts);
  S.drafts.forEach(d => { if (d.amount == null) d.on = false; });
  S.reading = false; render();
}
function draftDoc(d, source) {
  return clean({ date: d.date, time: d.time || '', amount: Math.abs(+d.amount), dir: d.dir, merchant: d.merchant || '', category: d.category, account: d.account || '', method: d.method || '', bank: d.bank || '', balance: d.balance ?? null, currency: d.currency || 'SAR', originalAmount: d.originalAmount ?? null, kind: d.kind, raw: d.raw, source: source || 'sms', cardId: d.cardSet ? (d.cardId || 'none') : undefined, toCardId: isMove(d.category) && d.toCardId ? d.toCardId : undefined, review: d.category === 'other' || d.category === 'other_in' ? true : undefined, ai: d.how === 'ai' || undefined, createdAt: new Date().toISOString() });
}
const OTP_RE = /(OTP|one[- ]?time|رمز|كلمة المرور|verification|التحقق)/i;
window.HF_importSms = async items => {
  const td = todayStr(); const ids = new Set(S.tx.map(x => x.id)); const ok = [], review = [];
  for (const it of items) for (const m of SmsParser.split(it.body)) {
    if (OTP_RE.test(m)) continue;
    const d = SmsParser.parseOne(m, td); d.id = 'sms-' + hash(d.raw.replace(/\s+/g, ' '));
    if (ids.has(d.id)) continue; ids.add(d.id);
    d.dateGuessed = !SmsParser.parseDate(d.raw);
    const a = autoCategory(d); d.category = a.cat; d.how = a.how; d.toCardId = a.to || '';
    if (d.dir === 'in' && findOutgoingPair({ ...d, cardId: '' })) { d.category = 'internal'; d.how = 'kind'; }
    if (d.kind === 'salary' && !d.merchant) d.merchant = S.lang === 'ar' ? 'الراتب' : 'Salary';
    if (d.amount == null || d.kind === 'unknown') { d.on = d.amount != null; d.dup = false; const kc = cardForAccount(d.account); d.cardId = kc ? kc.id : ''; review.push(d); }
    else ok.push(d);
  }
  const cross = crossedBy(ok.map(d => ({ category: d.category, amount: +d.amount, date: d.date, dir: d.dir })));
  let saved = 0;
  for (const d of ok) {
    if (d.dir === 'in' && !isMove(d.category) && findOutgoingPair(d)) d.category = 'internal';
    const m = findMarked(d); if (m) { await mergeSms(m, d); continue; }
    const doc = draftDoc(d, 'sms-auto'); if (await put('tx', d.id, doc, true)) { saved++; if (doc.toCardId) await pairIncoming(doc); }
  }
  if (review.length) { S.drafts = review.concat(S.drafts); }
  if (saved) toast(t('auto_saved', { n: saved }));
  if (review.length) toast(t('auto_review', { n: review.length }));
  const used = ok.filter(d => d.dir === 'out' && !isMove(d.category) && (cardForAccount(d.account) || {}).type === 'credit' && S.planMeta.noCardSince && d.date >= S.planMeta.noCardSince);
  render(); showCrossed(used.map(d => ({ state: 'over', text: t('card_alert', { c: cardLabel(cardForAccount(d.account)), v: nf.format(d.amount), m: d.merchant || '—', d: fmtShort(d.date) }) })).concat(cross));
};
async function saveDrafts() {
  const sel = S.drafts.filter(d => d.on && d.amount != null); if (!sel.length) return;
  const cross = crossedBy(sel.map(d => ({ category: d.category, amount: +d.amount, date: d.date, dir: d.dir })));
  let ok = 0;
  for (const d of sel) {
    if (d.mergeInto) { const m = S.tx.find(y => y.id === d.mergeInto); if (m) { await mergeSms(m, d); ok++; continue; } }
    const doc = draftDoc(d, 'sms');
    if (await put('tx', d.id, doc, true)) { ok++; if (doc.toCardId) await pairIncoming(doc); }
    if ((d.userCat || d.toSet) && d.merchant) { const k = ruleId(d.merchant); if (k) await put('rules', k, clean({ category: d.category, merchant: d.merchant, toCardId: isMove(d.category) && d.toCardId ? d.toCardId : undefined }), true); }
  }
  toast(`${t('saved_ok')} · ${ok}`); S.drafts = []; S.smsText = ''; go('home'); showCrossed(cross);
}

document.addEventListener('click', async e => {
  const el = e.target.closest('button,[data-edit-tx],[data-edit-card],[data-plan-open],[data-close]'); if (!el) { if (e.target.id === 'modal') closeModal(); return; }
  const ds = el.dataset;
  if (ds.nav) { if (!$('#modal').hidden) closeModal(); return go(ds.nav); }
  if (ds.lang) { S.lang = ds.lang; try { localStorage.setItem('hf-lang', S.lang); } catch (x) { } return render(); }
  if ('close' in ds) return closeModal();
  if ('more' in ds) return openModal(`${mh(t('tab_more'))}<div class="more-list">${VIEWS.filter(v => !['home', 'plan', 'add', 'tx'].includes(v)).map(v => `<button data-nav="${v}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[v]}</svg>${esc(t('nav_' + v))}</button>`).join('')}</div>`);
  if ('review' in ds) { S.f = { cycle: 'all', cat: 'all', dir: 'all', q: '', review: true }; return go('tx'); }
  if ('read' in ds) return readSms();
  if ('clear' in ds) { S.drafts = []; S.smsText = ''; return render(); }
  if ('saveDrafts' in ds) { el.disabled = true; return saveDrafts(); }
  if (ds.editTx != null) return modalTx(ds.editTx);
  if (ds.editPlan != null) return modalPlan(ds.editPlan);
  if (ds.step) { const s = S.steps.find(y => y.id === ds.step); if (s) { const n = { ...s, done: !s.done }; if (n.done) n.doneAt = todayStr(); else delete n.doneAt; await put('steps', s.id, strip(n), true); } return; }
  if (ds.pay && el.tagName === 'BUTTON') { const [k, id, date] = ds.pay.split('|'); return modalPay(k, id, date); }
  if ('planBudgets' in ds) { for (const [cid, b] of Object.entries(PLAN_BUDGETS)) await put('budgets', cid, clean({ ...(S.budgets[cid] || {}), ...b, id: undefined }), true); return toast(t('plan_budgets_done')); }
  if (ds.combine) { const id = ds.combine; const cur = new Set(((S.budgets[id] || {}).also) || []);
    const opts = OUT_CATS.filter(k => k.id !== id && !(((S.budgets[k.id] || {}).also || []).length) && (!budgetHost(k.id) || budgetHost(k.id) === id));
    return openModal(`${mh(t('combine_title') + ': ' + catName(id))}<p style="margin:0 0 10px;color:var(--ink-2);font-size:14px">${esc(t('combine_sub'))}</p><form id="combineForm" data-id="${id}"><div class="list">${opts.map(k => `<label class="check" style="padding:8px 0"><input type="checkbox" name="c_${k.id}" value="${k.id}" ${cur.has(k.id) ? 'checked' : ''}>${esc(k[S.lang])}</label>`).join('')}</div>${foot('')}</form>`); }
  if (ds.mark) { const [k, id, date] = ds.mark.split('|'); el.disabled = true; await markPaid(k, id, date); toast(t('marked')); return; }
  if (ds.planOpen) { S.planOpen = S.planOpen === ds.planOpen ? '' : ds.planOpen; return render(); }
  if (ds.planDone || ds.planUndo) { const it = S.plan.find(y => y.id === (ds.planDone || ds.planUndo)); if (it) { const n = { ...it }; if (ds.planDone) { n.status = 'done'; n.doneAt = todayStr(); } else { delete n.status; delete n.doneAt; } await put('plan', it.id, strip(n), true); } return; }
  if (ds.editCard != null) return modalCard(ds.editCard);
  if (ds.newCard) { const ex = S.cards.find(c => !c.digits || !c.digits.length); return modalCard('', ds.newCard); }
  if (ds.ignoreDigits) { S.settings.ignoredDigits = [...new Set([...(S.settings.ignoredDigits || []), ds.ignoreDigits])]; await saveSettings(); return render(); }
  if (ds.cardBal) return modalAmount(t('update_balance'), `data-card="${esc(ds.cardBal)}"`);
  if (ds.editSub != null) return modalSub(ds.editSub);
  if (ds.editGoal != null) return modalGoal(ds.editGoal);
  if (ds.editDebt != null) return modalDebt(ds.editDebt);
  if (ds.goalAdd) return modalAmount(t('add_money'), `data-goal="${esc(ds.goalAdd)}"`);
  const delKey = ['delTx', 'delSub', 'delGoal', 'delDebt', 'delCard', 'delPlan'].find(k => ds[k]);
  if (delKey) {
    if (!el.classList.contains('confirm')) { el.classList.add('confirm'); el.textContent = t('confirm_delete'); return; }
    await del({ delTx: 'tx', delSub: 'subs', delGoal: 'goals', delDebt: 'debts', delCard: 'cards', delPlan: 'plan' }[delKey], ds[delKey]); closeModal(); return;
  }
  if (ds.delOv) { delete S.settings.overrides[ds.delOv]; _sal = null; await saveSettings(); return render(); }
  if (ds.logSub) {

    const td = todayStr(); const d = subNext(s, addDays(td, -3)) || td;
    await put('tx', newId('t'), clean({ date: td, time: '', amount: s.amount, dir: 'out', merchant: s.name, category: s.category || 'subs', source: 'manual', note: 'subscription', createdAt: new Date().toISOString() }), true);
    await put('subs', s.id, strip({ ...s, nextDate: addMonths(d, subInterval(s), +s.nextDate.slice(8, 10)) }), true);
    return toast(t('logged'));
  }

    await put('debts', b.id, strip({ ...b, remaining: Math.max(0, Math.round((b.remaining - amt) * 100) / 100), nextDate: b.nextDate ? addMonths(b.nextDate, 1) : '' }), true);
    return toast(t('payment_logged'));
  }
  if ('copyCsv' in ds) {
    const rows = [['date', 'time', 'direction', 'amount', 'merchant', 'category', 'account', 'note']].concat(filteredTx().map(x => [x.date, x.time || '', x.dir, x.amount, x.merchant || '', catName(x.category), accName(x.account), x.note || '']));

    try { await navigator.clipboard.writeText(csv); toast(t('copied')); } catch (x) { toast(t('save_fail')); } return;
  }
  if ('copyJson' in ds) {
    const all = { tx: S.tx, plan: S.plan, planMeta: S.planMeta, cards: S.cards, subs: S.subs, budgets: S.budgets, goals: S.goals, debts: S.debts, settings: S.settings, rules: S.rules };
    try { await navigator.clipboard.writeText(JSON.stringify(all, null, 2)); toast(t('copied')); } catch (x) { toast(t('save_fail')); } return;
  }
  if ('aiReview' in ds) return aiReview();
  if ('saShow' in ds || 'saNew' in ds) { try { S.smsKey = await window.HF.smsKey('saNew' in ds); render(); } catch (x) { toast(t('save_fail')); } return; }
  if (ds.copyField) { const inp = document.getElementById(ds.copyField); try { await navigator.clipboard.writeText(inp.value); toast(t('copied')); } catch (x) { inp.select(); } return; }
  if ('export' in ds) { const data = await window.HF.exportAll(); const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `hassan-finance-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return; }
  if ('signout' in ds) return window.HF.signOut();
});
