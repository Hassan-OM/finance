  if (ds.d != null) { const d = S.drafts[+ds.d]; if (!d) return; const k = ds.k;
    d[k] = k === 'on' ? el.checked : k === 'amount' ? (el.value === '' ? null : +el.value) : el.value;
    if (k === 'category') { const pc = parseCat(el.value); d.category = pc.category; d.toCardId = pc.toCardId; if (pc.toCardId) d.toSet = true; d.userCat = true; d.how = 'user'; }
    if (k === 'cardId') d.cardSet = true;
    if (k === 'toCardId') d.toSet = true;
    if (k === 'dir') { const a = autoCategory({ ...d, kind: d.dir === 'in' ? 'transfer_in' : d.kind }); if (!d.userCat) { d.category = a.cat; } }
    return render(); }
  if (ds.f) { S.f[ds.f] = el.type === 'checkbox' ? el.checked : el.value; return render(); }
  if (ds.ins != null) { S.insCycle = el.value; S.aiErr = ''; return render(); }
  if (ds.budget) { const v = Math.max(0, +el.value || 0); const prev = { ...(S.budgets[ds.budget] || {}) }; delete prev.id; if (v) await put('budgets', ds.budget, clean({ ...prev, limit: v }), true); else await del('budgets', ds.budget); return; }
  if (ds.set) { S.settings[ds.set] = Math.max(0, +el.value || 0); if (ds.set === 'warnAt') S.settings.warnAt = Math.min(100, Math.max(50, S.settings.warnAt || 80)); if (ds.set === 'payday') S.settings.payday = Math.min(31, Math.max(1, S.settings.payday || 25)); _sal = null; await saveSettings(); return render(); }
  if (el.id === 'importFile' && el.files && el.files[0]) { try { const json = JSON.parse(await el.files[0].text()); const n = await window.HF.importAll(json); toast(t('imported', { n })); } catch (x) { toast(t('save_fail')); } el.value = ''; return; }
  if (ds.acc) { S.settings.accounts = { ...(S.settings.accounts || {}), [ds.acc]: el.value.trim() }; await saveSettings(); return; }
});
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target; const v = fd(f); const id = f.dataset.id;
  if (f.id === 'manualForm') {
    const pcm = parseCat(v.category);
    const ntx = { date: v.date, time: v.date === todayStr() ? nowTs().slice(11) : '', amount: Math.abs(+v.amount), dir: v.dir, merchant: v.merchant, category: pcm.category, toCardId: pcm.toCardId || undefined, note: v.note || undefined, cardId: v.cardId || undefined, source: 'manual', createdAt: new Date().toISOString() };
    const cross = crossedBy([ntx]);
    await put('tx', newId('t'), clean(ntx)); if (ntx.toCardId) await pairIncoming(ntx);
    f.reset(); f.querySelector('#m-date').value = todayStr(); render(); showCrossed(cross); return;
  }
  if (f.id === 'txForm') {
    const x = S.tx.find(y => y.id === id); if (!x) return;
    const pce = parseCat(v.category); v.category = pce.category;
    const nx = { ...x, dir: v.dir, amount: Math.abs(+v.amount), merchant: v.merchant, category: pce.category, date: v.date, note: v.note || undefined };
    if (nx.category !== 'other' && nx.category !== 'other_in') delete nx.review;
    if ((v.cardId || '') !== ((cardOf(x) || {}).id || '')) nx.cardId = v.cardId || 'none';
    if (isMove(nx.category) && pce.toCardId) nx.toCardId = pce.toCardId; else if (!isMove(nx.category)) delete nx.toCardId;
    const delta = (nx.dir === 'out' ? nx.amount : 0) - (x.dir === 'out' ? x.amount : 0);
    const cross = nx.category !== x.category || delta > 0 ? crossedBy([{ category: nx.category, amount: nx.category !== x.category ? nx.amount : delta, date: nx.date, dir: nx.dir }]) : [];
    await put('tx', id, strip(nx)); if (nx.toCardId) await pairIncoming(nx);
    if (v.remember && v.merchant && (v.category !== x.category || (nx.toCardId || '') !== (x.toCardId || ''))) {
      const k = ruleId(v.merchant);
      if (k) { await put('rules', k, clean({ category: v.category, merchant: v.merchant, toCardId: nx.toCardId }), true);
        for (const y of S.tx) if (y.id !== id && y.review && ruleId(y.merchant) === k) { const ny = { ...y, category: v.category }; delete ny.review; await put('tx', y.id, strip(ny), true); } }
    }
    closeModal(); return showCrossed(cross);
  }
  if (f.id === 'subForm') {
    const s = clean({ name: v.name.trim(), amount: +v.amount, amountMax: v.amountMax ? +v.amountMax : undefined, cycle: v.cycle, months: v.cycle === 'custom' ? Math.max(1, +v.months || 1) : undefined, nextDate: v.nextDate, category: v.category, keywords: v.keywords ? v.keywords.split(',').map(s => s.trim()).filter(Boolean) : [], note: v.note || undefined, autoRenew: !!v.autoRenew, promo: !!v.promo, estimate: !!v.estimate, active: !!v.active });
    await put('subs', id || newId('s'), s); return closeModal();
  }
  if (f.id === 'planForm') {
    const old = S.plan.find(y => y.id === id) || {};
    const n = clean({ ...old, id: undefined, name: v.name.trim(), type: v.type, amount: +v.amount || 0, repeat: v.repeat, date: v.date || undefined, until: v.until || undefined, cardId: v.cardId || undefined, payRest: v.type === 'card' && !!v.payRest ? true : undefined, note: v.note || undefined });
    await put('plan', id || newId('p'), n); return closeModal();
  }
  if (f.id === 'cardForm') {
    const old = S.cards.find(y => y.id === id) || {};
    const digits = v.digits.split(/[,،\s]+/).map(normDigits).filter(Boolean);
    const c = { ...old, name: v.name.trim(), bank: v.bank, type: v.type, digits, main: !!v.main, creditLimit: v.creditLimit ? +v.creditLimit : undefined };
    delete c.id;
    const prev = id ? cardBalance({ ...old, id }).v : null;
    const prevOwed = old.type === 'credit' && old.creditLimit && prev != null ? old.creditLimit - prev : null;
    if (v.type === 'credit' && v.creditLimit && v.owedNow !== '' && (prevOwed == null || Math.abs(+v.owedNow - prevOwed) > 0.004)) { c.balance = Math.round((+v.creditLimit - +v.owedNow) * 100) / 100; c.balanceAt = nowTs(); }
    else if (v.balance !== '' && (prev == null || Math.abs(+v.balance - prev) > 0.004)) { c.balance = +v.balance; c.balanceAt = nowTs(); }
    const cid = id || newId('c');
    if (c.main) for (const o of S.cards) if (o.id !== cid && o.main) await put('cards', o.id, strip({ ...o, main: false }), true);
    await put('cards', cid, clean(c)); closeModal(); if (c.balanceAt === nowTs() && id) askAlreadyPaid(); return;
  }
  if (f.id === 'amtForm' && f.dataset.card) { const k = S.cards.find(y => y.id === f.dataset.card); if (k) await put('cards', k.id, strip({ ...k, balance: +v.amount, balanceAt: nowTs() })); closeModal(); return askAlreadyPaid(); }
  if (f.id === 'payForm') {
    const [k, id, date] = f.dataset.pay.split('|'); const x = payItem(k, id, date) || { name: '' };
    if (v.record) { const pc = parseCat(v.category); const ntx = clean({ date: v.date, time: v.date === todayStr() ? nowTs().slice(11) : '', amount: Math.abs(+v.amount), dir: 'out', merchant: x.name, category: pc.category, toCardId: pc.toCardId || undefined, cardId: v.cardId || undefined, source: 'mark', createdAt: new Date().toISOString() });
      const cross = crossedBy([ntx]); await put('tx', newId('t'), ntx, true); if (ntx.toCardId) await pairIncoming(ntx); await markPaid(k, id, date); closeModal(); toast(t('marked')); return showCrossed(cross); }
    await markPaid(k, id, date); closeModal(); return toast(t('marked'));
  }
  if (f.id === 'combineForm') { const id = f.dataset.id; const also = [...f.querySelectorAll('input:checked')].map(i => i.value); const b = { ...(S.budgets[id] || { limit: 0 }) }; delete b.id; b.also = also; if (!also.length) delete b.also; await put('budgets', id, clean(b), true); return closeModal(); }
  if (f.id === 'paidForm') { const vals = [...f.querySelectorAll('input[type=checkbox]:checked')].map(i => i.value); for (const s of vals) { const [k, id, date] = s.split('|'); await markPaid(k, id, date); } closeModal(); if (vals.length) toast(t('marked')); return; }
  if (f.id === 'goalForm') { await put('goals', id || newId('g'), clean({ name: v.name.trim(), target: +v.target, saved: +v.saved || 0, deadline: v.deadline || undefined })); return closeModal(); }
  if (f.id === 'debtForm') { await put('debts', id || newId('d'), clean({ name: v.name.trim(), kind: v.kind, total: +v.total, remaining: +v.remaining, installment: +v.installment, nextDate: v.nextDate || undefined })); return closeModal(); }
  if (f.id === 'amtForm' && f.dataset.goal) { const g = S.goals.find(y => y.id === f.dataset.goal); if (g) await put('goals', g.id, strip({ ...g, saved: Math.round(((g.saved || 0) + (+v.amount || 0)) * 100) / 100 })); return closeModal(); }
  if (f.id === 'ovForm') { const d = $('#ov-date').value; if (!d) return; const key = d.slice(0, 7); S.settings.overrides = { ...(S.settings.overrides || {}), [key]: d }; _sal = null; await saveSettings(); return render(); }
});

/* tooltips */
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY - h - 10;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y < 8) y = e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});

/* AI monthly review */
async function aiReview() {
  const c = cycleByKey(S.insCycle), p = shiftCycle(c, -1); const T = cycleTotals(c), P = cycleTotals(p);
  const merch = {}; for (const x of S.tx) if (inCycle(x, c) && x.dir === 'out' && counts(x)) merch[x.merchant || '?'] = (merch[x.merchant || '?'] || 0) + x.amount;
  const top = Object.entries(merch).sort((a, b) => b[1] - a[1]).slice(0, 12);
  const data = {
    cycle: { start: c.start, end: c.end, today: todayStr() }, expectedSalary: +S.settings.expectedSalary || null,
    thisCycle: { income: T.inc, spending: T.out, byCategory: Object.fromEntries(Object.entries(T.byCat).map(([k, v]) => [CAT[k] ? CAT[k].en : k, Math.round(v)])) },
    lastCycle: { income: P.inc, spending: P.out, byCategory: Object.fromEntries(Object.entries(P.byCat).map(([k, v]) => [CAT[k] ? CAT[k].en : k, Math.round(v)])) },
    budgets: Object.fromEntries(Object.entries(S.budgets).map(([k, v]) => [CAT[k] ? CAT[k].en : k, v.limit])), monthlySpendingLimit: +S.settings.monthlyLimit || null,
    topMerchants: top.map(([m, v]) => ({ merchant: m, spent: Math.round(v) })),
    subscriptions: S.subs.filter(s => s.active !== false).map(s => ({ name: s.name, amount: s.amount, billing: s.cycle === 'custom' ? `every ${s.months} months` : s.cycle, monthlyEquivalent: Math.round(subMonthly(s) * 100) / 100, nextRenewal: subNext(s, todayStr()), promo: !!s.promo, estimate: !!s.estimate })),
    debts: S.debts.map(d => ({ name: d.name, remaining: d.remaining, installment: d.installment, nextDue: d.nextDate })),
    goals: S.goals.map(g => ({ name: g.name, target: g.target, saved: g.saved, deadline: g.deadline })),
    upcomingNext30Days: upcoming(todayStr(), addDays(todayStr(), 30)).map(u => ({ name: u.name, date: u.date, amount: u.amount })),
  };
  const lang = S.lang === 'ar' ? 'Arabic' : 'English';
  const prompt = `You are a careful personal finance reviewer for someone in Saudi Arabia (amounts in SAR, salary paid around the 25th, budget cycles run payday to payday). Write a concise review of the salary cycle below in ${lang}. Use only the numbers given; never invent figures. If data looks incomplete (e.g. no salary recorded), say so briefly.\n\nStructure with these short markdown headings: "Summary" (2-3 sentences with the key numbers), "What changed vs last cycle" (bullets), "Subscriptions & renewals" (what is coming, anything to reconsider, promo prices that may rise), "Budgets" (over/near limits, or suggest limits if none are set, based on actual spending), "3 actions for next cycle" (specific, numeric where possible). Keep it under 280 words. Plain markdown only.\n\nDATA:\n${JSON.stringify(data)}\n\nReturn JSON: {"text":"<the markdown review>"}`;
  S.aiBusy = true; S.aiErr = ''; render();
  try {
    const r = await ask(prompt, 'default');
    const text = r && r.text ? String(r.text) : '';
    if (!text) throw new Error('empty');
    await put('reviews', c.key, { text, createdAt: new Date().toISOString(), lang: S.lang }, true);
  } catch (e) { if (e && e.code === 'not_granted') S.sample = null; else S.aiErr = t('ai_fail'); }
  S.aiBusy = false; render();
}

/* ================= boot ================= */
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.view && VIEWS.includes(h)) { S.view = h; render(); } });
(function boot() {
  const h = location.hash.slice(1); if (VIEWS.includes(h)) S.view = h;
  setStatus('wait'); render();
  let tries = 0;
  (function wait() {
    if (!(window.claude && typeof window.claude.use === 'function')) { if (tries++ < 80) return setTimeout(wait, 100); setStatus('off'); return render(); }
    const use = n => window.claude.use(n).catch(() => null);
    use('user').then(async u => { S.user = u; if (u && typeof u.isOwner === 'function') { try { const o = await u.isOwner(); S.owner = o == null ? true : !!o; } catch (e) { } } schedule(); });
    use('sample').then(s => { S.sample = s; schedule(); });
    use('db').then(db => { if (!db) { setStatus('off'); render(); return; } S.db = db; subscribeAll(); });
  })();
})();
